<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_17 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_17" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_17');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Organic Leaf-like geometry
const geometry = new THREE.IcosahedronGeometry(1.5, 3);
const material = new THREE.MeshPhongMaterial({
  color: 0x19D3AE,
  wireframe: true,
  transparent: true,
  opacity: 0.6,
  emissive: 0x19D3AE,
  emissiveIntensity: 0.5
});
const leaf = new THREE.Mesh(geometry, material);
scene.add(leaf);

// Scanning Ring
const ringGeo = new THREE.TorusGeometry(2, 0.02, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x55E6C1, transparent: true, opacity: 0.8 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x19D3AE, 2, 10);
pointLight.position.set(2, 3, 4);
scene.add(pointLight);

camera.position.z = 5;

let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.01;
  
  leaf.rotation.y += 0.005;
  leaf.rotation.x += 0.002;
  
  // Pulse effect
  leaf.scale.setScalar(1 + Math.sin(time * 2) * 0.05);
  
  // Scanning movement
  ring.position.y = Math.sin(time) * 1.5;
  ring.material.opacity = 0.5 + Math.cos(time) * 0.3;
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const newWidth = container.clientWidth || window.innerWidth;
  const newHeight = container.clientHeight || window.innerHeight;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_17 -->
</body>
</html>
